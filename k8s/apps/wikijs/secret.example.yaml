# secret.example.yaml — Wiki.js + PostgreSQL
# Copiar a secret.yaml, rellenar valores reales y aplicar con:
#   kubectl apply -f k8s/apps/wikijs/secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: wikijs-secret
  namespace: apps
type: Opaque
stringData:
  DB_USER: "CAMBIAR_ESTE_VALOR"
  DB_PASS: "CAMBIAR_ESTE_VALOR"
---
apiVersion: v1
kind: Secret
metadata:
  name: wikijs-db-secret
  namespace: apps
type: Opaque
stringData:
  POSTGRES_USER: "CAMBIAR_ESTE_VALOR"
  POSTGRES_PASSWORD: "CAMBIAR_ESTE_VALOR"
