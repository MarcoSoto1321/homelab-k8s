apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-importer
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly-importer
  template:
    metadata:
      labels:
        app: firefly-importer
    spec:
      containers:
        - name: firefly-importer
          image: fireflyiii/data-importer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: TRUSTED_PROXIES
              value: "**"
            # URL interna del servicio de Firefly dentro del cluster
            - name: FIREFLY_III_URL
              value: "http://firefly-svc:80"
            # URL que abre el usuario en el navegador (para OAuth redirect)
            - name: VANITY_URL
              value: "https://firefly.marcosoto.dev"
            # Misma APP_KEY que usa Firefly — requerida para autenticación
            - name: FIREFLY_III_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefly-importer-secret
                  key: FIREFLY_III_ACCESS_TOKEN
            - name: APP_ENV
              value: "production"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  key: APP_KEY
                  name: firefly-secret
            # Permite subir CSVs grandes (estados de cuenta)
            - name: UPLOAD_SIZE
              value: "64M"
            # Timezone
            - name: TZ
              value: "America/Mexico_City"
          volumeMounts:
            - mountPath: /var/www/html/storage/upload
              name: firefly-data
      volumes:
        - name: firefly-data
          persistentVolumeClaim:
            claimName: firefly-pvc
