# secret.example.yaml — Vaultwarden
# Copiar a secret.yaml, rellenar valores reales y aplicar con:
#   kubectl apply -f k8s/apps/vaultwarden/secret.yaml
#
# Para codificar en base64:
#   echo -n "mi_valor" | base64
#
# secret.yaml está en .gitignore — NUNCA commitear con valores reales.

apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-secret
  namespace: apps
type: Opaque
stringData:
  ADMIN_TOKEN: "CAMBIAR_ESTE_VALOR"
  # DOMAIN no es secreto — va en el ConfigMap / Deployment directamente
