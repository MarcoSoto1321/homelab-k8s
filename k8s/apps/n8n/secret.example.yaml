# secret.example.yaml — n8n
# Copiar a secret.yaml, rellenar valores reales y aplicar con:
#   kubectl apply -f k8s/apps/n8n/secret.yaml
#
# ⚠️  CRÍTICO: N8N_ENCRYPTION_KEY debe ser EXACTAMENTE el mismo valor
#     que usabas en Docker. Si cambia, todas las credenciales almacenadas
#     en n8n quedarán inaccesibles.
#
#     Para recuperar el valor actual desde Docker:
#       docker exec n8n printenv N8N_ENCRYPTION_KEY
#     Si no está en las variables, buscar en:
#       /home/soreck/docker/n8n/data/.n8n/config

apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: apps
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: "CAMBIAR_ESTE_VALOR"
