# secret.example.yaml — Bookstack + MariaDB
# Copiar a secret.yaml, rellenar valores reales y aplicar con:
#   kubectl apply -f k8s/apps/bookstack/secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: bookstack-secret
  namespace: apps
type: Opaque
stringData:
  APP_KEY: "CAMBIAR_ESTE_VALOR"   # base64:... — mismo valor que en Docker
  DB_USER: "CAMBIAR_ESTE_VALOR"
  DB_PASS: "CAMBIAR_ESTE_VALOR"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstack-db-secret
  namespace: apps
type: Opaque
stringData:
  MYSQL_USER: "CAMBIAR_ESTE_VALOR"
  MYSQL_PASSWORD: "CAMBIAR_ESTE_VALOR"
  MYSQL_ROOT_PASSWORD: "CAMBIAR_ESTE_VALOR"
